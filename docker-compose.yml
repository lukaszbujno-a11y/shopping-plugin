services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-shopping_plugin}
      POSTGRES_USER: ${DB_USERNAME:-shopping_plugin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-shopping_plugin}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-shopping_plugin} -d ${DB_NAME:-shopping_plugin}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
